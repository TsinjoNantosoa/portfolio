[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# No SPA catch-all. Every public route is a prerendered file (see the generated dist/_redirects), and
# Netlify serves dist/404.html with a real 404 status for any other path. The client app boots from
# that file and renders its not-found page. Do not re-add `/* /index.html 200`: it makes every
# unknown URL answer 200 (soft 404) with the home page's metadata.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com; upgrade-insecure-requests"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files with stable names: cached for a while instead of being revalidated on every visit.
# A replaced image or CV can therefore take up to the max-age to reach returning visitors.
[[headers]]
  for = "/portfolio-uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/certificate/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/CV/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# The CV used to be published under two names with the same content. The old name is kept as a redirect.
[[redirects]]
  from = "/CV/CV_Tsinjo_Nantosoa.pdf"
  to = "/CV/CV_AIEngineer_AgentProduct_Sandaniaina_Tsinjo.pdf"
  status = 301
