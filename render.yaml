services:
  - type: web
    name: tsinjo-portfolio-ai
    runtime: docker
    rootDir: portfolio-ai-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: QDRANT_COLLECTION
        value: portfolio_knowledge
      - key: ALLOWED_ORIGINS
        value: https://tsinjona.netlify.app
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://tsinjona.netlify.app
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
