services:
  - type: web
    name: tsinjo-portfolio-ai
    runtime: docker
    rootDir: portfolio-ai-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "450"
      - key: OPENAI_TIMEOUT_SECONDS
        value: "60"
      - key: RAG_TOP_K
        value: "4"
      - key: RETRIEVAL_SCORE_THRESHOLD
        value: "0.20"
      - key: PLAYGROUND_ENABLED
        value: "false"
      - key: PLAYGROUND_SESSION_RATE_LIMIT_PER_HOUR
        value: "12"
      - key: PLAYGROUND_MAX_INPUT_CHARS
        value: "400"
      - key: PLAYGROUND_MAX_OUTPUT_TOKENS
        value: "300"
      - key: QDRANT_COLLECTION
        value: portfolio_knowledge
      - key: ALLOWED_ORIGINS
        value: https://tsinjona.netlify.app
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://tsinjona.netlify.app
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
