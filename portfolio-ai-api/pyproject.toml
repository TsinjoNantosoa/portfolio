[project]
name = "tsinjo-portfolio-ai"
version = "1.0.0"
description = "Read-only public RAG API for Tsinjo's portfolio assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "openai>=1.99,<3",
  "qdrant-client>=1.15,<2",
  "structlog>=25.4,<26",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
