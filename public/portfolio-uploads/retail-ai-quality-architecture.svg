    <text x="260" fill="#f2f7f4">Qdrant</text><text x="410" fill="#f2f7f4">Neon PostgreSQL</text><text x="670" fill="#f2f7f4">Google Sheets</text><text x="900" fill="#f2f7f4">OpenAI</text>
    <text x="1120" fill="#70ffca">AUDIT TRAIL</text>
