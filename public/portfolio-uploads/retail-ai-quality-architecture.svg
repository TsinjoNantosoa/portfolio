<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Retail AI Multi-Agent Quality Assistant architecture</title>
  <desc id="desc">Sanitized diagram showing Telegram, two AI agents, deterministic tools, human approval and audited actions.</desc>
  <rect width="1600" height="900" fill="#07100d"/>
  <path d="M0 110H1600M0 790H1600" stroke="#17382d"/>
  <text x="92" y="92" fill="#70ffca" font-family="ui-monospace, monospace" font-size="22" letter-spacing="4">FUNCTIONAL POC · SYNTHETIC DATA</text>
  <text x="92" y="174" fill="#f2f7f4" font-family="Arial, sans-serif" font-size="52" font-weight="700">Retail quality investigation,</text>
  <text x="92" y="234" fill="#f2f7f4" font-family="Arial, sans-serif" font-size="52" font-weight="700">with deterministic control.</text>
  <text x="92" y="286" fill="#9eb0a8" font-family="Arial, sans-serif" font-size="23">Two LLM agents reason over evidence. Workflows own KPI truth, approval and side effects.</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(92 380)">
      <rect width="190" height="150" rx="8" fill="#0d1a16" stroke="#2b5848"/>
      <circle cx="34" cy="36" r="14" fill="#70ffca"/>
      <text x="24" y="43" fill="#07100d" font-size="18" font-weight="700">T</text>
      <text x="24" y="86" fill="#f2f7f4" font-size="22" font-weight="700">Telegram</text>
      <text x="24" y="116" fill="#9eb0a8" font-size="16">Text + voice</text>
    </g>
    <path d="M292 455H362" stroke="#70ffca" stroke-width="3"/><path d="m352 447 12 8-12 8" fill="none" stroke="#70ffca" stroke-width="3"/>
    <g transform="translate(372 380)">
      <rect width="230" height="150" rx="8" fill="#10251e" stroke="#70ffca"/>
      <text x="24" y="48" fill="#70ffca" font-size="15" letter-spacing="2">LLM AGENT 01</text>
      <text x="24" y="88" fill="#f2f7f4" font-size="23" font-weight="700">Supervisor</text>
      <text x="24" y="119" fill="#9eb0a8" font-size="16">Context + tool selection</text>
    </g>
    <path d="M612 455H682" stroke="#70ffca" stroke-width="3"/><path d="m672 447 12 8-12 8" fill="none" stroke="#70ffca" stroke-width="3"/>
    <g transform="translate(692 350)">
      <rect width="250" height="210" rx="8" fill="#0d1a16" stroke="#2b5848"/>
      <text x="24" y="45" fill="#70ffca" font-size="15" letter-spacing="2">DETERMINISTIC</text>
      <text x="24" y="82" fill="#f2f7f4" font-size="23" font-weight="700">Business tools</text>
      <text x="24" y="119" fill="#9eb0a8" font-size="16">Product data · KPI rules</text>
      <text x="24" y="149" fill="#9eb0a8" font-size="16">RAG · history · state</text>
      <text x="24" y="179" fill="#9eb0a8" font-size="16">Post-generation validation</text>
    </g>
    <path d="M952 455H1022" stroke="#70ffca" stroke-width="3"/><path d="m1012 447 12 8-12 8" fill="none" stroke="#70ffca" stroke-width="3"/>
    <g transform="translate(1032 380)">
      <rect width="250" height="150" rx="8" fill="#10251e" stroke="#70ffca"/>
      <text x="24" y="48" fill="#70ffca" font-size="15" letter-spacing="2">LLM AGENT 02</text>
      <text x="24" y="87" fill="#f2f7f4" font-size="23" font-weight="700">Quality investigation</text>
      <text x="24" y="118" fill="#9eb0a8" font-size="16">Facts · hypotheses · checks</text>
    </g>
    <path d="M1292 455H1362" stroke="#70ffca" stroke-width="3"/><path d="m1352 447 12 8-12 8" fill="none" stroke="#70ffca" stroke-width="3"/>
    <g transform="translate(1372 380)">
      <rect width="150" height="150" rx="75" fill="#0d1a16" stroke="#70ffca" stroke-width="2"/>
      <text x="75" y="67" text-anchor="middle" fill="#f2f7f4" font-size="18" font-weight="700">HUMAN</text>
      <text x="75" y="96" text-anchor="middle" fill="#70ffca" font-size="15">APPROVE</text>
      <text x="75" y="118" text-anchor="middle" fill="#d7a96b" font-size="15">REJECT</text>
    </g>
