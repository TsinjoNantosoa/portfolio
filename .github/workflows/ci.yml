name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: TypeScript (app)
        run: npx tsc -p tsconfig.app.json --noEmit
      - name: TypeScript (build tooling)
        run: npx tsc -p tsconfig.node.json --noEmit
      - name: ESLint
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: SEO build verification
        run: npm run verify:seo
